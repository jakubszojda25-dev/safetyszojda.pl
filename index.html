<style>
:root{--g:#2e7d32;--g2:#e8f5e9;--g3:#c8e6c9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#fff;color:#1b3a1d;padding-bottom:110px;max-width:600px;margin:auto}
header{background:#fff;color:var(--g);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;font-size:21px;font-weight:700;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--g2)}
.top{position:sticky;top:0;z-index:5;background:#fff}
header img{width:36px;height:36px;border-radius:9px}
header button{background:none;border:none;color:var(--g);font-size:30px;padding:0 4px;line-height:1}
main{padding:12px}
.card{background:#fff;border:1px solid var(--g3);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 2px 6px #2e7d3212}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:var(--g);color:#fff;font-size:16px;font-weight:600;margin-top:8px}
.btn.sec{background:var(--g2);color:var(--g)}.btn.del{background:#fff;color:#c62828;border:1px solid #ef9a9a}
input,textarea,select{width:100%;padding:12px;font-size:16px;border:1px solid var(--g3);border-radius:10px;margin:4px 0 10px;font-family:inherit;background:#fbfdfb;color:#1b3a1d}
input:focus,textarea:focus,select:focus{outline:2px solid var(--g);border-color:var(--g)}
label{font-size:13px;color:#4f6f52;font-weight:600}
h2,h3{color:var(--g)}
nav{display:flex;background:#fff;border-bottom:2px solid var(--g2);gap:3px;padding:6px 4px}
nav button{flex:1;min-width:0;padding:6px 0;border:none;border-radius:10px;background:#f6faf6;font-size:9.5px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px;overflow:hidden;color:#6b8a6e;font-family:inherit}
nav button.on{background:var(--g);color:#fff;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid div{padding:9px 0;border-radius:10px;font-size:14px}
.day{background:#f6faf6}.day.has{background:var(--g3);font-weight:700}.day.today{outline:2px solid var(--g)}.day.sel{background:var(--g);color:#fff}
.photos{display:flex;flex-wrap:wrap;gap:6px}
.photos img{width:90px;height:90px;object-fit:cover;border-radius:10px;background:var(--g2)}
.muted{color:#6b8a6e;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center}

nav .ic{font-size:19px;line-height:1.1}
.hrow{display:flex;align-items:center;gap:8px;margin:4px 0 6px}
.hrow label{flex:1;font-size:16px;color:inherit;font-weight:600;display:flex;align-items:center;gap:8px}
.hrow input[type=checkbox]{width:22px;height:22px;margin:0}
.hrow .hh{width:96px;margin:0}
.modal{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.stat{flex:1;background:#f6faf6;border-radius:12px;padding:10px}.stat b{display:block;font-size:20px}
.seg{display:flex;gap:6px;background:#f6faf6;padding:4px;border-radius:12px;margin-bottom:10px}
.seg button{flex:1;padding:10px 2px;border:none;border-radius:9px;background:none;font-size:14px;font-weight:600;color:#6b8a6e;font-family:inherit}
.seg button.on{background:#fff;color:var(--g);box-shadow:0 1px 4px #0001}
.plus{width:44px;height:44px;border-radius:50%;border:none;background:var(--g);color:#fff;font-size:28px;line-height:1;padding:0;font-family:inherit;flex:none}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--g2);color:var(--g)}
.tag.red{background:#ffebee;color:#c62828}.tag.orange{background:#fff3e0;color:#e65100}
.sw{position:relative;margin-bottom:10px;border-radius:14px;overflow:hidden}
.sw .swc{margin:0;position:relative;transition:transform .2s ease;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.swdel{position:absolute;right:0;top:0;bottom:0;width:96px;background:#c62828;color:#fff;border:none;font-size:15px;font-weight:700;font-family:inherit}
.qrow{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:8px}
.qk{width:48px;height:48px;border-radius:50%;border:2px solid;background:#fff;font-size:24px;font-weight:700;line-height:1;padding:0;font-family:inherit;display:inline-flex;align-items:center;justify-content:center}
.qk.ok{border-color:var(--g);color:var(--g)}.qk.ok:active{background:var(--g);color:#fff}
.qk.no{border-color:#e57373;color:#c62828}.qk.no:active{background:#c62828;color:#fff}
.smsb{display:inline-flex;align-items:center;gap:4px;padding:10px 12px;border-radius:24px;background:#e3f2fd;color:#1565c0;font-size:14px;font-weight:700;text-decoration:none;margin-right:auto;white-space:nowrap}
</style>

</div>
<main id="app"><p class="muted">Ładowanie...</p></main>

<script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, collection, doc, setDoc, getDoc, deleteDoc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ====== TU WKLEJ SWOJE DANE Z FIREBASE ======
const firebaseConfig = {
  apiKey: "AIzaSyAaINOYF6gKr-vPyETMS4waBNO8HtGbS34",
  authDomain: "gruszka-7f2e2.firebaseapp.com",
  projectId: "gruszka-7f2e2",
  storageBucket: "gruszka-7f2e2.firebasestorage.app",
  messagingSenderId: "1075408336636",
  appId: "1:1075408336636:web:4675215e30e3153647c979"
};
// ============================================

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const fs = initializeFirestore(fb, { localCache: persistentLocalCache() });

// ---------- pomocnicze ----------
const $ = id => document.getElementById(id);
const app = $('app');

// ---------- LOGO: drzewo gruszy ----------
const ICON = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<rect width="512" height="512" fill="#ffffff"/>
<ellipse cx="256" cy="462" rx="190" ry="22" fill="#c8e6c9"/>
<path d="M236 460 L244 300 L268 300 L276 460 Z" fill="#795548"/>
<path d="M252 360 L200 320 M260 340 L312 302" stroke="#795548" stroke-width="16" stroke-linecap="round"/>
<circle cx="256" cy="200" r="150" fill="#2e7d32"/>
<circle cx="170" cy="170" r="78" fill="#388e3c"/>
<circle cx="340" cy="165" r="72" fill="#388e3c"/>
<circle cx="256" cy="110" r="80" fill="#43a047"/>
<g id="pear" fill="#cddc39" stroke="#9e9d24" stroke-width="3">
  <path d="M0 -26 C12 -26 12 -8 18 4 C28 22 18 38 0 38 C-18 38 -28 22 -18 4 C-12 -8 -12 -26 0 -26 Z"/>
  <path d="M0 -26 L3 -38" stroke="#5d4037" stroke-width="4" fill="none"/>
</g>
<use href="#pear" x="180" y="200"/>
<use href="#pear" x="300" y="230"/>
<use href="#pear" x="250" y="140"/>
<use href="#pear" x="350" y="150"/>
<use href="#pear" x="160" y="120"/>
</svg>`;
const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(ICON);
$('logo').src = iconUrl;
$('favIcon').href = iconUrl;
{ const im = new Image(); im.onload = () => {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    c.getContext('2d').drawImage(im, 0, 0, 180, 180);
    $('appleIcon').href = c.toDataURL('image/png');
  }; im.src = iconUrl; }

const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function plDate(s){return new Date(s+'T12:00').toLocaleDateString('pl-PL',{weekday:'short',day:'numeric',month:'long',year:'numeric'})}
function addDays(s,n){const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return ymd(d)}
// ---------- godzina i przewidywany czas ----------
const DURS = [[0,'nie wiem'],[30,'30 min'],[60,'1 godz.'],[90,'1,5 godz.'],[120,'2 godz.'],[150,'2,5 godz.'],[180,'3 godz.'],[240,'4 godz.'],[300,'5 godz.'],[360,'6 godz.'],[480,'cały dzień']];
const durSel = (id, val) => `<select id="${id}">${DURS.map(([n, t]) => `<option value="${n}" ${(+val || 0) === n ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
const fmtDur = m => { if (!m) return ''; if (m >= 480) return 'cały dzień'; const h = Math.floor(m / 60), r = m % 60;
  return (h ? h + ' godz.' : '') + (h && r ? ' ' : '') + (r ? r + ' min' : ''); };
const endTime = (t, m) => { if (!t || !m || m >= 480) return ''; const [h, mm] = t.split(':').map(Number), x = h * 60 + mm + m;
  return String(Math.floor(x / 60) % 24).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0'); };
const whenTxt = v => [v.time ? '🕘 ' + v.time + (endTime(v.time, v.dur) ? '–' + endTime(v.time, v.dur) : '') : '',
  v.dur ? '⏱ ' + fmtDur(v.dur) : ''].filter(Boolean).join('  ');
const timeFields = (pre, v) => `<div style="display:flex;gap:8px">
  <div style="flex:1"><label>Godzina</label><input id="${pre}t" type="time" value="${v.time || ''}"></div>
  <div style="flex:1"><label>Przewidywany czas</label>${durSel(pre + 'u', v.dur)}</div></div>`;
const byTime = (a, b) => (a.v.time || '99').localeCompare(b.v.time || '99');
// ---------- szybkie odhaczanie / anulowanie ----------
function setVisit(cid, vid, act){
  const c = findClient(cid); if (!c) return;
  const v = (c.visits||[]).find(x => x.id === vid); if (!v) return;
  if (act === 'done') { v.done = true; v.cancelled = false; if (v.amount == null) v.amount = c.price ?? null; v.paid = true; v.paidAt = ymd(new Date()); }
  if (act === 'cancel') { v.cancelled = true; v.done = false; }
  if (act === 'restore') v.cancelled = false;
  saveClient(c); if (view) view();
}
// ---------- SMS do klienta ----------
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const getSig = () => { try { return localStorage.getItem('gruszka-sig') || ''; } catch(e) { return ''; } };
const setSig = t => { try { localStorage.setItem('gruszka-sig', t); } catch(e) {} };
const whenPl = (d, time) => {
  const t = ymd(new Date());
  const w = d === t ? 'dziś' : d === addDays(t, 1) ? 'jutro'
    : 'w ' + new Date(d + 'T12:00').toLocaleDateString('pl-PL', {weekday: 'long', day: 'numeric', month: 'long'});
  return w + (time ? ' o godz. ' + time : '');
};
const withSig = txt => { const sig = getSig(); return txt + (sig ? ' ' + sig : ''); };
const smsText = v => withSig(`Dzień dobry, przypominam o wizycie ${whenPl(v.date, v.time)}${v.desc ? ' (' + v.desc + ')' : ''}. W razie zmian proszę o kontakt.`);
const smsHref = (c, txt) => { const num = (c.phone || '').replace(/[^0-9+]/g, ''); return num ? `sms:${num}${isIOS ? '&' : '?'}body=${encodeURIComponent(txt)}` : ''; };
const smsBtn = (c, v) => {
  const h = smsHref(c, smsText(v)); if (!h) return '';
  return `<a class="smsb" href="${h}" onclick="event.stopPropagation()">💬 SMS</a>`;
};
const quickBtns = (c, v) => (v.done || v.cancelled) ? '' : `<div class="qrow">${smsBtn(c, v)}<span class="muted" style="font-size:13px">Odbyła się?</span>
  <button class="qk ok" title="Odbyła się" data-act="done" data-c="${c.id}" data-vid="${v.id}">✓</button>
  <button class="qk no" title="Przenieś lub odwołaj" data-act="cancel" data-c="${c.id}" data-vid="${v.id}">✕</button></div>`;
function bindQuick(){
  app.querySelectorAll('[data-act]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const {act, c, vid} = b.dataset;
    if (act === 'cancel') return changeSheet(c, vid);
    if (act === 'done') return doneDialog(c, vid);
    setVisit(c, vid, act);
  });
}

// ---------- dźwięk syreny po odhaczeniu ----------
const sirenOn = () => { try { return localStorage.getItem('gruszka-siren') !== '0'; } catch(e) { return true; } };
const setSiren = on => { try { localStorage.setItem('gruszka-siren', on ? '1' : '0'); } catch(e) {} };
function playSiren(){
  if (!sirenOn()) return;
  try {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    const ctx = new A(), t0 = ctx.currentTime, len = 1.8;
    const osc = ctx.createOscillator(), lp = ctx.createBiquadFilter(), g = ctx.createGain();
    osc.type = 'square'; lp.type = 'lowpass'; lp.frequency.value = 1800;
    for (let i = 0; i < 4; i++) osc.frequency.setValueAtTime(i % 2 ? 622 : 466, t0 + i * 0.45);   // „i-u, i-u” jak wóz strażacki
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.18, t0 + 0.05);
    g.gain.setValueAtTime(0.18, t0 + len - 0.25); g.gain.linearRampToValueAtTime(0, t0 + len);
    osc.connect(lp); lp.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + len + 0.05); osc.onended = () => ctx.close();
    navigator.vibrate?.(200);
  } catch(e) {}
}

// ---------- przeniesienie / odwołanie wizyty ----------
function sheet(html){
  const w = document.createElement('div'); w.className = 'modal';
  w.innerHTML = `<div class="sheet">${html}</div>`;
  w.onclick = e => { if (e.target === w) w.remove(); };
  document.body.appendChild(w);
  return [w, id => w.querySelector('#' + id)];
}
const afterDefault = () => { if (view) view(); };
function changeSheet(cid, vid, after = afterDefault){
  const c = findClient(cid); if (!c) return;
  const v = (c.visits||[]).find(x => x.id === vid); if (!v) return;
  const [w, q] = sheet(`<h3 style="margin-top:0">${esc(c.name)}</h3>
    <p class="muted" style="margin-top:-8px">Wizyta: ${shortDate(v.date)}${v.time ? ', ' + v.time : ''}${v.desc ? ' – ' + esc(v.desc) : ''}</p>
    <button class="btn" id="chM">📅 Przenieś na inny termin</button>
    <button class="btn del" id="chO">✕ Odwołaj wizytę</button>
    <button class="btn sec" id="chC">Wróć</button>`);
  q('chC').onclick = () => w.remove();
  q('chM').onclick = () => { w.remove(); moveDialog(cid, vid, after); };
  q('chO').onclick = () => { w.remove(); cancelDialog(cid, vid, after); };
}
function moveDialog(cid, vid, after = afterDefault){
  const c = findClient(cid); if (!c) return;
  const v = (c.visits||[]).find(x => x.id === vid); if (!v) return;
  const [w, q] = sheet(`<h3 style="margin-top:0">📅 Przenieś wizytę</h3>
    <p class="muted" style="margin-top:-8px">${esc(c.name)} · teraz: ${shortDate(v.date)}${v.time ? ', ' + v.time : ''}</p>
    <label>Nowa data</label><input id="mvd" type="date" value="${v.date}">
    ${timeFields('mv', v)}
    ${c.phone ? '<label><input type="checkbox" id="mvs" style="width:auto" checked> Wyślij klientowi SMS o nowym terminie</label><br><br>' : ''}
    <button class="btn" id="mvS">Przenieś</button><button class="btn sec" id="mvC">Wróć</button>`);
  q('mvC').onclick = () => w.remove();
  q('mvS').onclick = () => {
    const nd = q('mvd').value; if (!nd) return alert('Wybierz nową datę');
    const old = {d: v.date, t: v.time};
    v.movedFrom = v.date; v.date = nd; v.time = q('mvt').value; v.dur = +q('mvu').value || null;
    saveClient(c); w.remove(); selDay = nd;
    const sms = q('mvs') && q('mvs').checked;
    after();
    if (sms) location.href = smsHref(c, withSig(`Dzień dobry, wizyta zaplanowana ${whenPl(old.d, old.t)} zostaje przeniesiona – nowy termin: ${whenPl(nd, v.time)}. Przepraszam za zmianę.`));
  };
}
function cancelDialog(cid, vid, after = afterDefault){
  const c = findClient(cid); if (!c) return;
  const v = (c.visits||[]).find(x => x.id === vid); if (!v) return;
  const [w, q] = sheet(`<h3 style="margin-top:0">✕ Odwołać wizytę?</h3>
    <p class="muted" style="margin-top:-8px">${esc(c.name)} · ${shortDate(v.date)}${v.time ? ', ' + v.time : ''}</p>
    <label>Powód (tylko dla Ciebie, opcjonalnie)</label><input id="cxr" placeholder="np. deszcz, klient wyjechał">
    ${c.phone ? '<label><input type="checkbox" id="cxs" style="width:auto" checked> Wyślij klientowi SMS o odwołaniu</label><br><br>' : ''}
    <button class="btn del" id="cxS">✕ Odwołaj wizytę</button><button class="btn sec" id="cxC">Wróć</button>`);
  q('cxC').onclick = () => w.remove();
  q('cxS').onclick = () => {
    v.cancelled = true; v.done = false; v.cancelReason = q('cxr').value.trim();
    saveClient(c); w.remove();
    const sms = q('cxs') && q('cxs').checked;
    after();
    if (sms) location.href = smsHref(c, withSig(`Dzień dobry, niestety muszę odwołać wizytę zaplanowaną ${whenPl(v.date, v.time)}. Odezwę się w sprawie nowego terminu.`));
  };
}

// ---------- wizyty cykliczne ----------
const EVERY = [['', 'Nie powtarzaj'], ['7d', 'Co tydzień'], ['14d', 'Co 2 tygodnie'], ['21d', 'Co 3 tygodnie'], ['1m', 'Co miesiąc'],
  ['2m', 'Co 2 miesiące'], ['3m', 'Co 3 miesiące'], ['6m', 'Co pół roku'], ['12m', 'Co rok']];
const everyTxt = e => (EVERY.find(x => x[0] === e) || ['', ''])[1];
function nextDate(d, e){
  const n = parseInt(e); if (e.endsWith('d')) return addDays(d, n);
  const x = new Date(d + 'T12:00'), day = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + n);
  x.setDate(Math.min(day, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate())); return ymd(x);
}
function planNext(c, v){
  if (!c.every) return null;
  if ((c.visits||[]).some(x => x.id !== v.id && !x.done && !x.cancelled && x.date > v.date)) return null;
  return nextDate(v.date, c.every);
}
function addNext(c, v, plan){
  const d = planNext(c, v); if (!d) return null;
  c.visits.push({id: newId(), date: d, time: v.time || '', dur: v.dur || null, done: false, cancelled: false, desc: plan || '',
    remind: v.remind ?? 1, amount: null, paid: false, before: [], after: []});
  return d;
}

// ---------- okno po odhaczeniu wizyty ----------
function pickPhotos(cam, onFile){
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
  if (cam) i.setAttribute('capture', 'environment'); else i.multiple = true;
  i.onchange = async () => { for (const f of i.files) await onFile(f); }; i.click();
}
// ---------- godziny pracy i pomocnicy ----------
const parseH = t => { t = String(t ?? '').trim().replace(',', '.'); return t === '' || isNaN(+t) ? null : +t; };
const fmtH = h => (Math.round((+h || 0) * 10) / 10).toString().replace('.', ',') + ' h';
const hoursOf = v => v.hours != null ? +v.hours : (v.dur ? v.dur / 60 : 0);
function helpersHtml(v){
  const list = [...(settings.helpers || [])];
  (v.helpers || []).forEach(x => { if (!list.some(h => h.id === x.id)) list.push({id: x.id, name: x.name}); });
  if (!list.length) return '<p class="muted">Dodaj pomocników w zakładce 👷 Pomocnicy.</p>';

// ---------- ZDJĘCIA: Firebase + kopia w telefonie ----------
let pdb;
const pdbReady = new Promise(r => {
  const o = indexedDB.open('ogrod-zdjecia', 1);
  o.onupgradeneeded = e => e.target.result.createObjectStore('p', { keyPath: 'id' });
  o.onsuccess = e => { pdb = e.target.result; navigator.storage?.persist?.(); r(); };
});
const ps = m => pdb.transaction('p', m).objectStore('p');
const idbPut = rec => new Promise(r => { ps('readwrite').put(rec).onsuccess = r; });
const idbGet = id => new Promise(r => { const q = ps('readonly').get(id); q.onsuccess = () => r(q.result); });
const idbAll = () => new Promise(r => { const q = ps('readonly').getAll(); q.onsuccess = () => r(q.result); });
const photoDoc = id => doc(fs, 'users', user.uid, 'photos', id);

async function upload(rec){
  try { await setDoc(photoDoc(rec.id), { data: rec.data }); await idbPut({ ...rec, up: true }); } catch(e) {}
}
async function putPhoto(id, data){
  await pdbReady; const rec = { id, data, up: false };
  await idbPut(rec); upload(rec);
}
async function getPhoto(id){
  await pdbReady;
  const r = await idbGet(id); if (r) return r.data;
  try { const s = await getDoc(photoDoc(id));
    if (s.exists()) { const data = s.data().data; await idbPut({ id, data, up: true }); return data; } } catch(e) {}
  return null;
}
async function delPhoto(id){
  await pdbReady;
  await new Promise(r => { ps('readwrite').delete(id).onsuccess = r; });
  deleteDoc(photoDoc(id)).catch(() => {});
}
async function syncPhotos(){
  await pdbReady;
  for (const r of await idbAll()) if (!r.up) await upload(r);
}
function loadImgs(){app.querySelectorAll('img[data-pid]').forEach(async im=>{const d=await getPhoto(im.dataset.pid);if(d)im.src=d})}
function shrink(file){return new Promise(r=>{const img=new Image();img.onload=()=>{
  const max=1000,s=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',0.7));
  URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(file)})}

function reminders(){
  const today = ymd(new Date()), r = [];
  clients.forEach(c => (c.visits||[]).forEach(v => {
    if (v.done || v.cancelled) return;
    const ile = v.remind ?? 1;
    if (v.date < today) r.push({c, v, t: '⚠️ Zaległa – ' + plDate(v.date)});
    else if (ile >= 0 && addDays(v.date, -ile) <= today) r.push({c, v, t: v.date === today ? '🔔 DZIŚ' : '🔔 ' + plDate(v.date)});
  }));
  r.sort((a, b) => a.v.date.localeCompare(b.v.date));
  try { navigator.setAppBadge?.(r.length)?.catch?.(() => {}); } catch(e) {}
  return r;
}

function markPaid(cid, vid, paid){
  const c = findClient(cid); if (!c) return;
  const v = (c.visits||[]).find(x => x.id === vid); if (!v) return;
  if (paid && v.amount == null) {
    const a = prompt('Ile zapłacił klient? (zł)', c.price ?? ''); if (a === null) return;
    const k = a.trim().replace(',', '.'); if (k === '' || isNaN(+k)) return alert('Wpisz kwotę (może być 0).');
    v.amount = +k;
  }
  v.paid = paid; v.paidAt = paid ? ymd(new Date()) : null;
  saveClient(c); if (view) view();
}

function bindSwipe(onOpen){
  let openEl = null;
  const close = el => { if (el) { el.style.transform = ''; if (openEl === el) openEl = null; } };
  app.querySelectorAll('.sw').forEach(w => {
    const card = w.querySelector('.swc');
    let x0 = 0, y0 = 0, dx = 0, drag = false, moved = false, startOpen = false;
    card.addEventListener('pointerdown', e => {
      x0 = e.clientX; y0 = e.clientY; dx = 0; drag = true; moved = false; startOpen = openEl === card;
      if (openEl && openEl !== card) close(openEl);
      card.style.transition = 'none';
    });
    card.addEventListener('pointermove', e => {
      if (!drag) return;
      const mx = e.clientX - x0, my = e.clientY - y0;
      if (!moved && Math.abs(mx) < 8) return;
      if (!moved && Math.abs(my) > Math.abs(mx)) { drag = false; return; }
      moved = true; dx = Math.max(-110, Math.min(0, mx + (startOpen ? -96 : 0)));
      card.style.transform = `translateX(${dx}px)`;
    });
    const end = () => {
      if (!drag) return; drag = false; card.style.transition = '';
      if (!moved) return;
      if (dx < -48) { card.style.transform = 'translateX(-96px)'; openEl = card; } else close(card);
    };
    card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
    card.addEventListener('click', () => {
      if (moved) { moved = false; return; }
      if (openEl) { close(openEl); return; }
      onOpen(w.dataset.c, w.dataset.v);
    });
    w.querySelector('.swdel').onclick = () => {
      if (!confirm('Usunąć ten wpis z historii razem ze zdjęciami?')) return close(card);
      deleteVisit(w.dataset.c, w.dataset.v); showHistory();
    };
  });
}

  const v = found || {id: newId(), date: selDay || ymd(new Date()), done: false, desc: '', remind: 1, amount: null, paid: false, before: [], after: []};
  const wasDone = !!v.done, plan0 = v.desc || '';
  v.before = v.before || []; v.after = v.after || [];
  const added = [], removed = [];
  head(c.name, () => { added.forEach(delPhoto); back(); });
  const ph = k => v[k].map((p, i) => `<img data-pid="${p}" data-k="${k}" data-i="${i}">`).join('');

  const draw = () => {
    app.innerHTML = `<div class="card">
    <label>Data</label><input id="dt" type="date" value="${v.date}">
    ${v.done ? `<label>⏱ Usługa trwała (godz.)</label><input id="vh" type="text" inputmode="decimal" autocomplete="off" placeholder="np. 2,5" value="${v.hours ?? (v.dur ? v.dur / 60 : '')}">
      ${helpersHtml(v)}` : timeFields('dt', v)}
    <label>Przypomnij</label><select id="rm">
      ${[[-1,'Nie przypominaj'],[0,'W dniu wizyty'],[1,'1 dzień wcześniej'],[2,'2 dni wcześniej'],[7,'Tydzień wcześniej']]
        .map(([n, t]) => `<option value="${n}" ${(v.remind ?? 1) == n ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <label><input type="checkbox" id="dn" style="width:auto" ${v.done ? 'checked' : ''}> Wykonane</label><br><br>
    <label>Opis – co zostało zrobione</label><textarea id="ds" rows="4">${esc(v.desc)}</textarea>
    <label>Kwota za tę wizytę (zł)</label><input id="am" type="text" inputmode="decimal" autocomplete="off" value="${v.amount ?? c.price ?? ''}">
    <label><input type="checkbox" id="pd" style="width:auto" ${v.paid ? 'checked' : ''}> Zapłacone</label><br><br>
    <label>Zdjęcia PRZED</label><div class="photos">${ph('before')}</div>
    <button class="btn sec" id="ab">📷 Dodaj zdjęcia przed</button><br>
    <label>Zdjęcia PO</label><div class="photos">${ph('after')}</div>
    <button class="btn sec" id="aa">📷 Dodaj zdjęcia po</button><br>
    <label>Następna wizyta (opcjonalnie)</label><input id="nx" type="date">
    ${timeFields('nx', {})}
    ${v.cancelled ? `<p style="color:#c62828;font-weight:600">🚫 Ta wizyta jest odwołana.${v.cancelReason ? ' Powód: ' + esc(v.cancelReason) : ''}</p>` : ''}
    ${v.movedFrom && !v.done && !v.cancelled ? `<p class="muted">↪ Przeniesiona z ${shortDate(v.movedFrom)}</p>` : ''}
    <button class="btn" id="s">Zapisz</button>
    ${isNew || v.done ? '' : v.cancelled ? '<button class="btn sec" id="cx">↩️ Przywróć wizytę</button>'
      : '<div style="display:flex;gap:8px"><button class="btn sec" id="mv">📅 Przenieś</button><button class="btn del" id="cx">✕ Odwołaj</button></div>'}
    ${isNew ? '' : '<button class="btn del" id="d">🗑 Usuń wizytę</button>'}</div>
    <p class="muted">Dotknij zdjęcia, aby je powiększyć lub usunąć.</p>`;
    loadImgs();
    if ($('vh')) bindHelpers(app, () => parseH($('vh').value));
    $('dn').onchange = () => { keep(); draw(); };
    const keep = () => { v.date = $('dt').value;
      if ($('dtt')) { v.time = $('dtt').value; v.dur = +$('dtu').value || null; }
      if ($('vh')) { v.hours = parseH($('vh').value); v.helpers = readHelpers(app, v.hours); }
      v.remind = +$('rm').value; v.done = $('dn').checked; if (v.done) v.cancelled = false; v.desc = $('ds').value;
      v.amount = parseH($('am').value); v.paid = $('pd').checked; v.paidAt = v.paid ? (v.paidAt || ymd(new Date())) : null; };
    const add = k => { keep(); const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.multiple = true;
      i.onchange = async () => { for (const f of i.files) { const id = newId(); await putPhoto(id, await shrink(f)); v[k].push(id); added.push(id); } draw(); };
      i.click(); };
    $('ab').onclick = () => add('before'); $('aa').onclick = () => add('after');
    app.querySelectorAll('.photos img').forEach(im => im.onclick = () => { keep();
      const w = document.createElement('div');
      w.style.cssText = 'position:fixed;inset:0;background:#000e;z-index:9;display:flex;flex-direction:column;justify-content:center;padding:20px';
      w.innerHTML = `<img src="${im.src}" style="max-width:100%;max-height:75vh;object-fit:contain"><button class="btn del">Usuń zdjęcie</button><button class="btn sec">Zamknij</button>`;
      w.children[1].onclick = () => { const id = v[im.dataset.k].splice(+im.dataset.i, 1)[0];
        if (added.includes(id)) delPhoto(id); else removed.push(id); w.remove(); draw(); };
      w.children[2].onclick = () => w.remove(); document.body.appendChild(w); });
    $('s').onclick = () => { keep(); if (!v.date) return alert('Wybierz datę');
      const i = c.visits.findIndex(x => x.id === v.id); if (i >= 0) c.visits[i] = v; else c.visits.push(v);
      const nx = $('nx').value;
      if (!wasDone && v.done && !nx) addNext(c, v, plan0);
      if (nx) c.visits.push({id: newId(), date: nx, time: $('nxt').value, dur: +$('nxu').value || null, done: false, desc: '',
        remind: 1, amount: null, paid: false, before: [], after: []});
      removed.forEach(delPhoto); saveClient(c); back(); };
    const saveNow = () => { keep(); const i = c.visits.findIndex(x => x.id === v.id); if (i >= 0) c.visits[i] = v;
      removed.forEach(delPhoto); removed.length = 0; added.length = 0; saveClient(c); };
    if ($('mv')) $('mv').onclick = () => { saveNow(); moveDialog(c.id, v.id, back); };
    if ($('cx')) $('cx').onclick = () => {
      if (v.cancelled) { keep(); v.cancelled = false; saveNow(); return back(); }
      saveNow(); cancelDialog(c.id, v.id, back); };
    if (!isNew) $('d').onclick = () => { if (confirm('Usunąć wizytę i jej zdjęcia?')) {
      c.visits = c.visits.filter(x => x.id !== v.id); [...v.before, ...v.after, ...removed].forEach(delPhoto); saveClient(c); back(); } };
  };
  draw();
}
</script>
</body>
</html>
